{% extends "base.html" %}
{% block title %}Connection request — Crescopus{% endblock %}
{% block content %}
<h1>Connection request</h1>
<p>From <span class="text-grower">{{ sender.full_name }}</span> &middot; {{ listing.title }}</p>
<p>{{ req.message }}</p>

<form method="POST" action="{{ url_for('connection_requests.accept', request_id=req.id) }}" style="display:inline;">
  <button type="submit">Accept &amp; connect</button>
</form>

<form method="POST" action="{{ url_for('connection_requests.reject', request_id=req.id) }}" style="display:inline;margin-left:8px;">
  <input type="text" name="reject_reason" placeholder="Reason (optional)" style="width:auto;display:inline-block;">
  <button type="submit">Decline</button>
</form>
{% endblock %}
