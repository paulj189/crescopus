{# "Continue with Google / LinkedIn / GitHub" buttons, shared by Log in and Sign up. #}

  <a class="cx-social-btn" href="{{ url_for('auth.social_start', provider='linkedin') }}">Continue with LinkedIn</a>

<p class="cx-social-or"><span>{{ or_text }}</span></p>
