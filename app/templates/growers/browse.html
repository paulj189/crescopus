{% extends "base.html" %}
{% block title %}Growers — Crescopus{% endblock %}
{% block content %}
<h1>Growers</h1>
<div class="card-list">
  {% for grower in growers %}
    <a class="card" href="{{ url_for('growers.detail', grower_id=grower.id) }}">
      <h3 class="text-grower">{{ grower.full_name }}</h3>
      <p>{{ grower.bio or "No bio yet." }}</p>
    </a>
  {% else %}
    <div class="empty">No growers listed yet.</div>
  {% endfor %}
</div>
{% endblock %}
