{% extends "base.html" %}
{% block title %}Edit revenue stream — Crescopus{% endblock %}
{% block content %}
<h1>Edit revenue stream on {{ listing.title }}</h1>
<form method="POST">
  <div>
    <label for="stream_type">Type</label>
    <select id="stream_type" name="stream_type" required>
      <option value="store_iap" {% if stream.stream_type == 'store_iap' %}selected{% endif %}>Store subscriptions / in-app purchases</option>
      <option value="web_revenuecat" {% if stream.stream_type == 'web_revenuecat' %}selected{% endif %}>Web payments (via RevenueCat)</option>
      <option value="advertising" {% if stream.stream_type == 'advertising' %}selected{% endif %}>Advertising</option>
      <option value="existing_processor" {% if stream.stream_type == 'existing_processor' %}selected{% endif %}>Existing payment processor</option>
      <option value="no_stream_yet" {% if stream.stream_type == 'no_stream_yet' %}selected{% endif %}>No revenue stream yet — open to discussion</option>
      <option value="other" {% if stream.stream_type == 'other' %}selected{% endif %}>Other</option>
    </select>
  </div>
  <div><label for="min_revenue_share">Minimum CrescoShares you'll keep on this stream</label><input type="number" id="min_revenue_share" name="min_revenue_share" min="0" max="100" value="{{ stream.min_revenue_share or '' }}"></div>
  <div><label for="looking_for">What are you looking for in a partner for this stream?</label><textarea id="looking_for" name="looking_for">{{ stream.looking_for or '' }}</textarea></div>
  <div><label for="control_boundaries">What should a partner not touch, on this stream?</label><textarea id="control_boundaries" name="control_boundaries">{{ stream.control_boundaries or '' }}</textarea></div>
  <button type="submit">Save changes</button>
</form>
{% endblock %}
