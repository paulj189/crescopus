{% extends "base.html" %}
{% block title %}Submit a pitch — Crescopus{% endblock %}
{% block content %}
<h1>Submit a pitch</h1>
<form method="POST">
  <div><label for="revenue_share_offered">CrescoShares you're offering the developer (out of 100)</label><input type="number" id="revenue_share_offered" name="revenue_share_offered" min="0" max="100" required></div>
  <div><label for="growth_plan">Growth plan</label><textarea id="growth_plan" name="growth_plan" required></textarea></div>
  <div><label for="track_record_summary">Your track record</label><textarea id="track_record_summary" name="track_record_summary"></textarea></div>
  <div><label for="term_length_months">Proposed term (months)</label><input type="number" id="term_length_months" name="term_length_months" min="1"></div>
  <div style="margin:16px 0;">
    <label style="display:flex;align-items:flex-start;gap:8px;text-transform:none;font-family:var(--sans);font-size:13px;color:var(--muted);">
      <input type="checkbox" name="consent_acknowledged" required style="width:auto;margin-top:3px;">
      <span>I understand Crescopus doesn't broker, manage, verify, or guarantee this CrescoPact, and that Crescopus is not a party to it or responsible for what happens between the developer and me.</span>
    </label>
  </div>
  <button type="submit">Send pitch</button>
</form>
{% endblock %}
