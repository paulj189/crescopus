{% extends "base.html" %}
{% block title %}Submit a proposal — Crescopus{% endblock %}
{% block content %}
<h1>Submit a proposal</h1>
<form method="POST">
  <div><label for="revenue_share_offered">Revenue share you're offering the developer (%)</label><input type="number" id="revenue_share_offered" name="revenue_share_offered" min="0" max="100" required></div>
  <div><label for="growth_plan">Growth plan</label><textarea id="growth_plan" name="growth_plan" required></textarea></div>
  <div><label for="track_record_summary">Your track record</label><textarea id="track_record_summary" name="track_record_summary"></textarea></div>
  <div><label for="term_length_months">Proposed term (months)</label><input type="number" id="term_length_months" name="term_length_months" min="1"></div>
  <button type="submit">Send proposal</button>
</form>
{% endblock %}
