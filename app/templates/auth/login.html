{% extends "base.html" %}
{% block title %}Log in — Crescopus{% endblock %}
{% block content %}
<h1>Log in</h1>
{% with or_text = "or log in with your email" %}{% include "auth/_social.html" %}{% endwith %}
<form method="POST" class="cx-auth-form">
  <div>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
  </div>
  <div>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
  </div>
  <button type="submit">Log in</button>
</form>
<p class="cu-small cu-muted cx-auth-switch">New to Crescopus? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
{% endblock %}
