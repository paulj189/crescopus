{% extends "base.html" %}
{% block title %}Set revenue terms — Crescopus{% endblock %}
{% block content %}
<h1>Set revenue terms</h1>
<p>Entirely optional, and only relevant once you're both ready to structure the relationship.</p>
<form method="POST">
  <div><label for="revenue_share">CrescoShares the developer keeps (out of 100)</label><input type="number" id="revenue_share" name="revenue_share" min="0" max="100" value="{{ partnership.revenue_share or '' }}" required></div>
  <div style="margin:16px 0;">
    <label style="display:flex;align-items:flex-start;gap:8px;text-transform:none;font-family:var(--sans);font-size:13px;color:var(--muted);">
      <input type="checkbox" name="consent_acknowledged" required style="width:auto;margin-top:3px;">
      <span>I understand Crescopus doesn't broker, manage, verify, or guarantee this CrescoPact, and that Crescopus is not a party to it or responsible for what happens between us.</span>
    </label>
  </div>
  <button type="submit">Save</button>
</form>
{% endblock %}
